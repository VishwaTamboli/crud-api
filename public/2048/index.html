<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2048</title>
    <style>
      :root {
        --gap: 12px;
        --bg: #faf8ef;
        --text: #776e65;
        --board: #bbada0;
        --accent: #8f7a66;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 28px 16px;
        display: flex;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Clear Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      main { width: min(94vw, 480px); }
      .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      h1 { margin: 0; font-size: clamp(3rem, 12vw, 4.6rem); font-weight: 800; }
      .scores { display: flex; gap: 8px; }
      .score-box {
        position: relative;
        min-width: 76px;
        padding: 8px 16px;
        text-align: center;
        color: #fff;
        background: var(--board);
        border-radius: 6px;
      }
      .score-box .label {
        display: block;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #eee4da;
      }
      .score-box .value { display: block; font-size: 1.35rem; font-weight: 700; }
      .score-pop {
        position: absolute;
        left: 0;
        right: 0;
        top: 8px;
        font-weight: 700;
        color: #776e65;
        pointer-events: none;
        animation: rise 0.6s ease-in forwards;
      }
      @keyframes rise {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-26px); }
      }
      .middle { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0; }
      .middle p { margin: 0; line-height: 1.4; }
      button {
        padding: 10px 18px;
        border: 0;
        border-radius: 6px;
        color: #fff;
        background: var(--accent);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover { filter: brightness(1.07); }
      .board {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        background: var(--board);
        border-radius: 8px;
        touch-action: none;
        outline: none;
      }
      .grid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: var(--gap);
        padding: var(--gap);
      }
      .grid > div { background: rgba(238, 228, 218, 0.35); border-radius: 6px; }
      .tiles { position: absolute; inset: 0; }
      .tile {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        font-weight: 700;
        transition: transform 110ms ease-in-out;
        will-change: transform;
      }
      .tile.pop { animation: pop 150ms ease; }
      @keyframes pop {
        0% { scale: 0.2; }
        55% { scale: 1.12; }
        100% { scale: 1; }
      }
      .v2 { background: #eee4da; color: #776e65; }
      .v4 { background: #ede0c8; color: #776e65; }
      .v8 { background: #f2b179; color: #f9f6f2; }
      .v16 { background: #f59563; color: #f9f6f2; }
      .v32 { background: #f67c5f; color: #f9f6f2; }
      .v64 { background: #f65e3b; color: #f9f6f2; }
      .v128 { background: #edcf72; color: #f9f6f2; }
      .v256 { background: #edcc61; color: #f9f6f2; }
      .v512 { background: #edc850; color: #f9f6f2; }
      .v1024 { background: #edc53f; color: #f9f6f2; }
      .v2048 { background: #edc22e; color: #f9f6f2; }
      .vsuper { background: #3c3a32; color: #f9f6f2; }
      .overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        border-radius: 8px;
      }
      .overlay.win { background: rgba(237, 194, 46, 0.5); }
      .overlay.lose { background: rgba(238, 228, 218, 0.73); }
      .overlay p { margin: 0; font-size: clamp(2rem, 8vw, 3.2rem); font-weight: 800; }
      .overlay-buttons { display: flex; gap: 10px; }
      .hidden { display: none !important; }
      .help { margin-top: 16px; font-size: 0.95rem; line-height: 1.5; }
      .back a { color: var(--accent); }
      @media (prefers-reduced-motion: reduce) {
        .tile { transition: none; }
        .tile.pop, .score-pop { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <h1>2048</h1>
        <div class="scores">
          <div class="score-box" id="score-box">
            <span class="label">Score</span>
            <span class="value" id="score-value">0</span>
          </div>
          <div class="score-box">
            <span class="label">Best</span>
            <span class="value" id="best-value">0</span>
          </div>
        </div>
      </div>
      <div class="middle">
        <p>Join the numbers and get to the <strong>2048 tile!</strong></p>
        <button id="new-game" type="button">New Game</button>
      </div>
      <div class="board" id="board" role="application" aria-label="2048 game board">
        <div class="grid" id="grid" aria-hidden="true"></div>
        <div class="tiles" id="tiles"></div>
        <div class="overlay hidden" id="overlay" role="status">
          <p id="overlay-message"></p>
          <div class="overlay-buttons">
            <button id="keep-going" type="button" class="hidden">Keep going</button>
            <button id="try-again" type="button">Try again</button>
          </div>
        </div>
      </div>
      <p class="help">
        <strong>How to play:</strong> Use the arrow keys or WASD (swipe on touch
        screens) to slide the tiles. When two tiles with the same number touch,
        they merge into one.
      </p>
      <p class="back"><a href="/">← Back to Todos</a></p>
    </main>
    <script>
      const SIZE = 4;
      const SLIDE_MS = 120;
      const SWIPE_MIN = 24;
      const BEST_KEY = "best-2048";
      const VECTORS = {
        up: { dr: -1, dc: 0 },
        down: { dr: 1, dc: 0 },
        left: { dr: 0, dc: -1 },
        right: { dr: 0, dc: 1 },
      };
      const KEYMAP = {
        ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
        w: "up", a: "left", s: "down", d: "right",
        W: "up", A: "left", S: "down", D: "right",
      };

      const boardEl = document.getElementById("board");
      const tilesEl = document.getElementById("tiles");
      const scoreEl = document.getElementById("score-value");
      const bestEl = document.getElementById("best-value");
      const scoreBox = document.getElementById("score-box");
      const overlay = document.getElementById("overlay");
      const overlayMessage = document.getElementById("overlay-message");
      const keepGoingBtn = document.getElementById("keep-going");

      let tiles = []; // live tiles: { id, value, row, col, el, merged }
      let metrics = null;
      let score = 0;
      let best = loadBest();
      let nextId = 1;
      let state = "playing"; // "playing" | "won" | "over"
      let keepGoing = false;
      let locked = false; // blocks input while the slide animation settles
      let epoch = 0; // invalidates pending timers when a new game starts

      function loadBest() {
        try { return Number(localStorage.getItem(BEST_KEY)) || 0; }
        catch { return 0; }
      }

      function saveBest(value) {
        try { localStorage.setItem(BEST_KEY, String(value)); } catch {}
      }

      function computeMetrics() {
        const size = boardEl.clientWidth;
        const gap = Math.max(8, Math.round(size * 0.028));
        const cell = (size - gap * (SIZE + 1)) / SIZE;
        return { gap, cell };
      }

      function positionTile(tile) {
        const { gap, cell } = metrics;
        const x = gap + tile.col * (cell + gap);
        const y = gap + tile.row * (cell + gap);
        tile.el.style.width = `${cell}px`;
        tile.el.style.height = `${cell}px`;
        tile.el.style.transform = `translate(${x}px, ${y}px)`;
        const digits = String(tile.value).length;
        const factor = digits <= 2 ? 0.44 : digits === 3 ? 0.37 : digits === 4 ? 0.3 : 0.24;
        tile.el.style.fontSize = `${Math.floor(cell * factor)}px`;
      }

      function layout() {
        metrics = computeMetrics();
        boardEl.style.setProperty("--gap", `${metrics.gap}px`);
        for (const tile of tiles) positionTile(tile);
      }

      function createTileElement(tile) {
        const el = document.createElement("div");
        el.className = tile.value <= 2048 ? `tile v${tile.value}` : "tile vsuper";
        el.textContent = tile.value;
        return el;
      }

      function spawnTile() {
        const occupied = new Set(tiles.map((t) => t.row * SIZE + t.col));
        const empty = [];
        for (let i = 0; i < SIZE * SIZE; i++) {
          if (!occupied.has(i)) empty.push({ row: Math.floor(i / SIZE), col: i % SIZE });
        }
        if (!empty.length) return;
        const spot = empty[Math.floor(Math.random() * empty.length)];
        const tile = {
          id: nextId++,
          value: Math.random() < 0.9 ? 2 : 4,
          row: spot.row,
          col: spot.col,
          merged: false,
          el: null,
        };
        tile.el = createTileElement(tile);
        positionTile(tile);
        tile.el.classList.add("pop");
        tilesEl.append(tile.el);
        tiles.push(tile);
      }

      function updateScores(gained) {
        scoreEl.textContent = score;
        bestEl.textContent = best;
        if (gained > 0) {
          const pop = document.createElement("div");
          pop.className = "score-pop";
          pop.textContent = `+${gained}`;
          scoreBox.append(pop);
          pop.addEventListener("animationend", () => pop.remove(), { once: true });
        }
      }

      function move(direction) {
        if (state !== "playing" || locked) return;
        const vector = VECTORS[direction];
        const grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
        for (const tile of tiles) grid[tile.row][tile.col] = tile;

        const rows = [0, 1, 2, 3];
        const cols = [0, 1, 2, 3];
        if (vector.dr === 1) rows.reverse();
        if (vector.dc === 1) cols.reverse();

        let moved = false;
        let gained = 0;
        const consumed = new Set();
        const mergedResults = [];

        for (const r of rows) {
          for (const c of cols) {
            const tile = grid[r][c];
            if (!tile) continue;

            // Slide to the farthest empty cell in the move direction.
            let tr = r;
            let tc = c;
            while (true) {
              const nr = tr + vector.dr;
              const nc = tc + vector.dc;
              if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE || grid[nr][nc]) break;
              tr = nr;
              tc = nc;
            }

            // The cell just beyond may hold a merge candidate.
            const mr = tr + vector.dr;
            const mc = tc + vector.dc;
            const target =
              mr >= 0 && mr < SIZE && mc >= 0 && mc < SIZE ? grid[mr][mc] : null;

            if (target && target.value === tile.value && !target.merged) {
              grid[r][c] = null;
              grid[mr][mc] = null;
              tile.row = mr;
              tile.col = mc;
              consumed.add(tile);
              consumed.add(target);
              const merged = {
                id: nextId++,
                value: tile.value * 2,
                row: mr,
                col: mc,
                merged: true, // a tile merges at most once per move
                el: null,
              };
              grid[mr][mc] = merged;
              mergedResults.push(merged);
              gained += merged.value;
              moved = true;
            } else if (tr !== r || tc !== c) {
              grid[r][c] = null;
              grid[tr][tc] = tile;
              tile.row = tr;
              tile.col = tc;
              moved = true;
            }
          }
        }

        if (!moved) return;
        locked = true;

        // Start the slide: update positions of all currently rendered tiles
        // (consumed tiles slide onto their merge cell before being removed).
        for (const tile of tiles) positionTile(tile);

        score += gained;
        if (score > best) {
          best = score;
          saveBest(best);
        }
        updateScores(gained);

        const currentEpoch = epoch;
        setTimeout(() => {
          if (currentEpoch !== epoch) return; // a new game started meanwhile
          for (const tile of consumed) tile.el.remove();
          tiles = tiles.filter((t) => !consumed.has(t));
          for (const merged of mergedResults) {
            merged.merged = false;
            merged.el = createTileElement(merged);
            positionTile(merged);
            merged.el.classList.add("pop");
            tilesEl.append(merged.el);
            tiles.push(merged);
          }
          spawnTile();
          locked = false;
          evaluate();
        }, SLIDE_MS);
      }

      function movesAvailable() {
        if (tiles.length < SIZE * SIZE) return true;
        const grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
        for (const tile of tiles) grid[tile.row][tile.col] = tile;
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const value = grid[r][c].value;
            if (c + 1 < SIZE && grid[r][c + 1].value === value) return true;
            if (r + 1 < SIZE && grid[r + 1][c].value === value) return true;
          }
        }
        return false;
      }

      function evaluate() {
        if (!keepGoing && tiles.some((t) => t.value === 2048)) {
          state = "won";
          showOverlay("You win! 🎉", true);
        } else if (!movesAvailable()) {
          state = "over";
          showOverlay("Game over!", false);
        }
      }

      function showOverlay(message, isWin) {
        overlayMessage.textContent = message;
        overlay.classList.remove("hidden", "win", "lose");
        overlay.classList.add(isWin ? "win" : "lose");
        keepGoingBtn.classList.toggle("hidden", !isWin);
      }

      function hideOverlay() {
        overlay.classList.add("hidden");
      }

      function newGame() {
        epoch++;
        for (const tile of tiles) tile.el.remove();
        tiles = [];
        score = 0;
        state = "playing";
        keepGoing = false;
        locked = false;
        updateScores(0);
        hideOverlay();
        spawnTile();
        spawnTile();
      }

      // Background cells.
      const gridEl = document.getElementById("grid");
      for (let i = 0; i < SIZE * SIZE; i++) {
        gridEl.append(document.createElement("div"));
      }

      window.addEventListener("keydown", (event) => {
        const direction = KEYMAP[event.key];
        if (!direction) return;
        event.preventDefault();
        move(direction);
      });

      let touchStart = null;
      boardEl.addEventListener("touchstart", (event) => {
        touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
      }, { passive: true });
      boardEl.addEventListener("touchend", (event) => {
        if (!touchStart) return;
        const dx = event.changedTouches[0].clientX - touchStart.x;
        const dy = event.changedTouches[0].clientY - touchStart.y;
        touchStart = null;
        const absX = Math.abs(dx);
        const absY = Math.abs(dy);
        if (Math.max(absX, absY) < SWIPE_MIN) return;
        move(absX > absY ? (dx > 0 ? "right" : "left") : dy > 0 ? "down" : "up");
      });

      document.getElementById("new-game").addEventListener("click", newGame);
      document.getElementById("try-again").addEventListener("click", newGame);
      keepGoingBtn.addEventListener("click", () => {
        keepGoing = true;
        state = "playing";
        hideOverlay();
        if (!movesAvailable()) {
          state = "over";
          showOverlay("Game over!", false);
        }
      });

      window.addEventListener("resize", layout);

      bestEl.textContent = best;
      layout();
      newGame();
    </script>
  </body>
</html>
